{{- if .Values.metrics.grafanaDashboard.enabled }}
{{- $gd := .Values.metrics.grafanaDashboard -}}
{{- /* Loaded with .Files.Get so Helm never templates Grafana's {{ }} legends or ${} variables. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "celeste.fullname" . }}-grafana-dashboard
  namespace: {{ $gd.namespace | default .Release.Namespace }}
  labels:
    {{- include "celeste.labels" (dict "root" . "component" "dashboard") | nindent 4 }}
    {{- with $gd.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gd.folder }}
  annotations:
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
  celeste.json: |-
    {{- .Files.Get "dashboards/celeste.json" | nindent 4 }}
{{- end }}
