{{- $fn := include "celeste.fullname" . -}}
{{- $akv := .Values.externalSecrets.akv -}}
{{- $plugin := eq .Values.youtube.backend "plugin" -}}
{{- /* Each ExternalSecret only contains AKV names, never values. */ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fn }}-bot
  labels:
    {{- include "celeste.labels" (dict "root" . "component" "bot") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  {{- include "celeste.secretStoreRef" . | nindent 2 }}
  target:
    name: {{ $fn }}-bot
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: {{ $akv.discordToken }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: LAVALINK_PASSWORD
      remoteRef:
        key: {{ $akv.lavalinkPassword }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: WEB_SESSION_SECRET
      remoteRef:
        key: {{ $akv.webSessionSecret }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fn }}-lavalink
  labels:
    {{- include "celeste.labels" (dict "root" . "component" "lavalink") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  {{- include "celeste.secretStoreRef" . | nindent 2 }}
  target:
    name: {{ $fn }}-lavalink
    creationPolicy: Owner
  data:
    - secretKey: LAVALINK_PASSWORD
      remoteRef:
        key: {{ $akv.lavalinkPassword }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SPOTIFY_CLIENT_ID
      remoteRef:
        key: {{ $akv.spotifyClientId }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SPOTIFY_CLIENT_SECRET
      remoteRef:
        key: {{ $akv.spotifyClientSecret }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- if and .Values.lavalink.appleMusic.enabled .Values.lavalink.appleMusic.tokenFromSecret }}
    - secretKey: APPLE_MUSIC_MEDIA_API_TOKEN
      remoteRef:
        key: {{ $akv.appleMusicToken }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
    {{- if $plugin }}
    - secretKey: YTCIPHER_PASSWORD
      remoteRef:
        key: {{ $akv.ytCipherPassword }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- if .Values.youtube.plugin.oauth.enabled }}
    - secretKey: YT_OAUTH_REFRESH_TOKEN
      remoteRef:
        key: {{ $akv.ytOauthRefreshToken }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
    {{- if .Values.youtube.plugin.poToken.enabled }}
    - secretKey: YT_PO_TOKEN
      remoteRef:
        key: {{ $akv.ytPoToken }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: YT_VISITOR_DATA
      remoteRef:
        key: {{ $akv.ytVisitorData }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
    {{- end }}
{{- if include "celeste.ytCipherEnabled" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fn }}-yt-cipher
  labels:
    {{- include "celeste.labels" (dict "root" . "component" "yt-cipher") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  {{- include "celeste.secretStoreRef" . | nindent 2 }}
  target:
    name: {{ $fn }}-yt-cipher
    creationPolicy: Owner
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: {{ $akv.ytCipherPassword }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- if and (eq .Values.youtube.backend "ytdlp") .Values.resolver.cookies.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fn }}-ytdlp-cookies
  labels:
    {{- include "celeste.labels" (dict "root" . "component" "resolver") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  {{- include "celeste.secretStoreRef" . | nindent 2 }}
  target:
    name: {{ $fn }}-ytdlp-cookies
    creationPolicy: Owner
  data:
    - secretKey: cookies.txt
      remoteRef:
        key: {{ $akv.ytdlpCookies }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- if .Values.image.pullSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "celeste.pullSecretName" . }}
  labels:
    {{- include "celeste.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  {{- include "celeste.secretStoreRef" . | nindent 2 }}
  target:
    name: {{ include "celeste.pullSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ "{{ .dockerconfig }}" }}"
  data:
    # The AKV secret holds the complete dockerconfigjson document.
    - secretKey: dockerconfig
      remoteRef:
        key: {{ .Values.image.pullSecret.akvSecretName }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
