{{- if eq .Values.youtube.backend "ytdlp" }}
{{- $fn := include "celeste.fullname" . -}}
{{- $ctx := dict "root" . "component" "resolver" -}}
{{- $img := include "celeste.image" (dict "root" . "image" .Values.resolver.image) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-resolver
  labels:
    {{- include "celeste.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.resolver.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "celeste.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "celeste.labels" $ctx | nindent 8 }}
      {{- with .Values.resolver.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- include "celeste.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.resolver.cookies.enabled }}
      initContainers:
        # yt-dlp rewrites its cookie jar on exit, and Secret volumes are read-only, so hand it a writable copy.
        - name: copy-cookies
          image: {{ $img }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "cp /cookies-src/cookies.txt /secrets/cookies.txt && chmod 600 /secrets/cookies.txt"]
          securityContext:
            {{- include "celeste.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: cookies-src, mountPath: /cookies-src, readOnly: true}
            - {name: cookies, mountPath: /secrets}
      {{- end }}
      containers:
        - name: resolver
          image: {{ $img }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "celeste.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: PORT, value: "8080"}
            - {name: POT_BASE_URL, value: "http://127.0.0.1:4416"}
            - {name: COOKIES_PATH, value: "/secrets/cookies.txt"}
            - {name: EXEC_TIMEOUT_SECONDS, value: {{ .Values.resolver.execTimeoutSeconds | quote }}}
            - {name: MAX_CONCURRENCY, value: {{ .Values.resolver.maxConcurrency | quote }}}
            - {name: ALLOWED_URL_HOSTS, value: {{ .Values.resolver.allowedUrlHosts | quote }}}
            - {name: LOG_LEVEL, value: {{ .Values.resolver.logLevel | quote }}}
            - {name: PLAYBACK_FALLBACK_CLIENTS, value: {{ .Values.resolver.playbackFallbackClients | quote }}}
            {{- with .Values.resolver.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resolver.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.resolver.cookies.enabled }}
            - {name: cookies, mountPath: /secrets}
            {{- end }}
        # PO token provider. Bound to the pod's loopback only (--host 127.0.0.1); it is unauthenticated.
        # No probes: kubelet probes reach the pod IP, not loopback. The resolver's /readyz pings it instead.
        - name: bgutil
          image: {{ .Values.resolver.bgutilImage }}:{{ .Values.resolver.bgutilVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--host", "127.0.0.1"]
          securityContext:
            {{- include "celeste.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resolver.bgutilResources | nindent 12 }}
          volumeMounts:
            - {name: bgutil-tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: bgutil-tmp, emptyDir: {}}
        {{- if .Values.resolver.cookies.enabled }}
        - name: cookies-src
          secret:
            secretName: {{ $fn }}-ytdlp-cookies
            defaultMode: 0400
        - {name: cookies, emptyDir: {}}
        {{- end }}
      {{- include "celeste.scheduling" .Values.resolver | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-resolver
  labels:
    {{- include "celeste.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "celeste.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
