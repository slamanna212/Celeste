apiVersion: v2
name: celeste
description: Celeste, a self-hosted Discord music bot (bot + web panel, Lavalink, yt-dlp resolver, Postgres via CloudNativePG)
type: application
# version is owned by CI: release.yml and chart.yml both override it from the git tag.
version: 0.1.0
# appVersion is NOT overridden by chart.yml (chart-only releases), so it must track the
# newest released images - with image.tag empty the chart renders that tag, and a stale
# value here silently downgrades the running bot on a chart-v* publish.
appVersion: "0.1.2"
kubeVersion: ">=1.27.0-0"
home: https://github.com/slamanna212/Celeste
sources:
  - https://github.com/slamanna212/Celeste
