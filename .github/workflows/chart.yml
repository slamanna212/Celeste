name: chart

on:
  push:
    branches: [main]
    tags: ['chart-v*']
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.2
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: helm lint
        run: |
          helm lint charts/celeste -f charts/celeste/values-example.yaml --set youtube.backend=ytdlp
          helm lint charts/celeste -f charts/celeste/values-example.yaml --set youtube.backend=plugin
      - name: helm template | kubeconform
        run: |
          for backend in ytdlp plugin; do
            echo "::group::backend=${backend}"
            helm template celeste charts/celeste --namespace celeste \
              -f charts/celeste/values-example.yaml --set "youtube.backend=${backend}" \
              | kubeconform -strict -ignore-missing-schemas -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chart-v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.2
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Package and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          helm package charts/celeste --version "${TAG#chart-v}" --destination dist
          helm push dist/celeste-"${TAG#chart-v}".tgz oci://ghcr.io/slamanna212/charts
